name: CI

#on:
  #push:
   # branches: [ "main" ]
  #pull_request:
   # branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Tests
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t student-risk-api .

      - name: Run Docker Container
        run: docker run -d --name student-risk-api -p 8000:8000 student-risk-api

      - name: Smoke Test API
        run: |
          for i in $(seq 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @tests/sample_student.json | tee response.json
          grep -q '"prediction"' response.json

      - name: Show Container Logs
        if: failure()
        run: docker logs student-risk-api
