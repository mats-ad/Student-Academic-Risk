[project]
name = "student-academic-risk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mats-ad", email = "matsadel11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
student-academic-risk = "student_academic_risk:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "pytest>=9.2.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
